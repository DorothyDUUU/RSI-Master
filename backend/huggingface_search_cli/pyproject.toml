[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "huggingface-search-cli"
version = "1.0.0"
description = "Unified CLI + server for HuggingFace dataset search, inspection, download, and materialization"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "click>=8.1.0",
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "pydantic>=2.5.0",
    "requests>=2.31.0",
    "urllib3>=2.0.0",
    "httpx>=0.27.0",
    "huggingface_hub>=0.20.0",
    "datasets>=2.16.0",
    "PyYAML>=6.0",
]

[project.scripts]
hf-search = "huggingface_search_cli.cli.main:main"

[tool.setuptools.packages.find]
include = ["huggingface_search_cli*"]
